
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          test -f MonikaAndroidStarter-0.5.zip || { echo "ZIP not found in repository root"; exit 1; }
          unzip -oq MonikaAndroidStarter-0.5.zip
          test -f MonikaAndroidStarter/settings.gradle.kts

      - name: Build debug APK
        working-directory: MonikaAndroidStarter
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Monika-Companion-debug-APK
          path: MonikaAndroidStarter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
