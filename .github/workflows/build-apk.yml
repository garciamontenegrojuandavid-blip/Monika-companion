
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP
        run: |
          test -f MonikaAndroidStarter-0.5.zip || { echo "ZIP not found"; exit 1; }
          unzip -oq MonikaAndroidStarter-0.5.zip
          test -f MonikaAndroidStarter/app/build.gradle.kts

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("MonikaAndroidStarter/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures { compose = true }"

          replacement = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          buildFeatures { compose = true }'''

          if marker not in s:
              raise SystemExit("Could not find the expected Gradle configuration")
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Build debug APK
        working-directory: MonikaAndroidStarter
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Monika-Companion-debug-APK
          path: MonikaAndroidStarter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
